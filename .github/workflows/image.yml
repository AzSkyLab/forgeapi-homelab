name: Image

# Builds the forgeapi image and publishes it to GitHub Container Registry, so hosting needs no
# paid registry. Runs on version tags and on demand; never on ordinary pushes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check release tag matches project version
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['GITHUB_REF_NAME']
          if ref != f'v{version}':
              raise SystemExit(f'release tag {ref!r} does not match project version v{version}')
          PY
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The docker-container driver (vs. the default docker driver) is required for the
      # provenance/sbom attestations below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/forgeapi
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      # Same tag scheme, separate image: this target bundles the Temporal dev-server binary for
      # lab/local use only (app/engine.py); AKS runs the default image above against an
      # external Temporal (AGENTS.md).
      - id: meta-engine
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/forgeapi-engine
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: engine
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          labels: ${{ steps.meta-engine.outputs.labels }}
          provenance: mode=max
          sbom: true
