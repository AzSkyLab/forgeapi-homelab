# Business-unit mapping: who may deploy what, where. See docs/tenancy.md.
# Copy to tenants.yaml, fill in, and set FORGEAPI_TENANTS_PATH=tenants.yaml.
# Granting a team access to the API = adding their Entra group here.
# Optional: Entra groups whose members may read every business unit's audit events (docs/audit.md).
# It grants nothing else.
auditors:
  - 00000000-0000-0000-0000-0000000000ff

# Optional: Entra groups whose members may resolve ("reconcile") an uncertain operation in any
# business unit, after inspecting Terraform state and provider evidence themselves. It grants
# nothing else: no deployments, no patterns, no other changes.
operators:
  - 00000000-0000-0000-0000-0000000000fe

business_units:
  finance:
    groups:                               # Entra group object IDs; membership = access
      - 00000000-0000-0000-0000-000000000001
    inject:                               # supplied to any pattern that declares the variable,
      business_unit: finance              # and hidden from callers
      cost_center: "CC-1042"
    patterns: [key-vault, resource-group] # everything else is invisible to this BU
    regions:
      allowed: [eastus2, centralus]
      default: eastus2                    # beats the pattern's own default
    environments:
      dev:
        subscription_id: 00000000-0000-0000-0000-0000000000aa
        budget_monthly: 500               # estimated monthly cost ceiling; omit for unlimited
        network:                          # injected the same way as `inject`
          private_endpoint_subnet_id: /subscriptions/.../subnets/snet-private-endpoints
      prd:
        subscription_id: 00000000-0000-0000-0000-0000000000bb
        groups:                           # if set, BU membership alone is not enough here
          - 00000000-0000-0000-0000-000000000002
        network:
          private_endpoint_subnet_id: /subscriptions/.../subnets/snet-private-endpoints
        allow_destroy: false              # `action: destroy` intents are denied here (default true)
        protected_resource_types:         # a plan that deletes or replaces any of these is denied
          - azurerm_key_vault
          - azurerm_storage_account
