# Optional single-host packaging. Native startup needs only uv; execution also needs Terraform/git.
name: forgeapi

x-app: &app
  env_file:
    - path: .env
      required: false
  environment:
    FORGEAPI_DB_BACKEND: sqlite
    FORGEAPI_GITHUB_TOKEN: ${FORGEAPI_GITHUB_TOKEN:-}
  volumes:
    - ./.local/data:/data

services:
  api:
    <<: *app
    image: forgeapi:dev
    build: .
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      FORGEAPI_DB_BACKEND: sqlite
      FORGEAPI_GITHUB_TOKEN: ${FORGEAPI_GITHUB_TOKEN:-}
      FORGEAPI_TEMPORAL_ADDRESS: engine:7233
      # Lab-only: callers reach this over the docker bridge, not loopback, with no auth mode set.
      FORGEAPI_ALLOW_UNAUTHENTICATED_REMOTE: "true"

  engine:
    <<: *app
    # Separate image from api: this target bundles the Temporal dev-server binary (lab/local
    # only, see app/engine.py); the default target api uses has no server binary in it.
    image: forgeapi-engine:dev
    build:
      context: .
      target: engine
    ports: ["127.0.0.1:8233:8000"]
    command: [python, -m, app.engine]
    environment:
      FORGEAPI_DB_BACKEND: sqlite
      FORGEAPI_GITHUB_TOKEN: ${FORGEAPI_GITHUB_TOKEN:-}
      FORGEAPI_AZURE_CLIENT_CERTIFICATE_PATH: /run/executor/client.pfx
    volumes:
      - ./.local/data:/data
      - ./.local/executor:/run/executor:ro
