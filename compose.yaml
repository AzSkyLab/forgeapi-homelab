# `docker compose up --build`, then curl localhost:8000. Ports are loopback-only.
name: forgeapi

x-app: &app
  image: forgeapi:dev
  env_file:
    - path: .env
      required: false
  # Read access to private pattern repos, passed at run time and never written to disk:
  #   FORGEAPI_GITHUB_TOKEN=$(gh auth token) docker compose up --build -d
  environment: &env
    FORGEAPI_GITHUB_TOKEN: ${FORGEAPI_GITHUB_TOKEN:-}
  # Deployment workspaces, Terraform state, logs and the SQLite database. Same directory the
  # native (non-Docker) run uses, so state survives either way.
  volumes: &data
    - ./.local/data:/data

services:
  temporal:
    image: temporalio/temporal:1.8.3
    command: [server, start-dev, --ip, 0.0.0.0, --ui-port, "8233", --ui-disable-news-fetch]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, 127.0.0.1:7233]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    build: .  # the only service that builds; the worker reuses the image
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      temporal: {condition: service_healthy}

  worker:
    <<: *app
    command: [python, -m, app.worker]
    environment:
      <<: *env
      FORGEAPI_AZURE_CLIENT_CERTIFICATE_PATH: /run/executor/client.pfx
    # Only the worker sees the Terraform executor certificate (read-only). The API never does.
    volumes:
      - ./.local/data:/data
      - ./.local/executor:/run/executor:ro
    depends_on:
      temporal: {condition: service_healthy}
