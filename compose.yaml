name: forgeapi-local

x-app: &app
  image: forgeapi-local:dev
  build:
    context: .
    target: runtime
  environment:
    FORGE_MODE: local-demo
    LOCAL_CONTAINER: "true"
    LISTEN_ADDR: 0.0.0.0:8080
    PUBLIC_BASE_URL: http://localhost:8080
    DATABASE_URL: postgres://forge:local-fixture-only@postgres:5432/forge?sslmode=disable
    TEMPORAL_ADDRESS: temporal:7233
  networks: [local]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: local-fixture-only
      POSTGRES_DB: forge
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [local]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 2s
      retries: 30

  temporal-volume-init:
    image: temporalio/temporal:1.8.3@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    user: "0:0"
    entrypoint: [/bin/sh, -c]
    command: ["chown 1000:1000 /data"]
    volumes: ["temporal-data:/data"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  temporal:
    image: temporalio/temporal:1.8.3@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /data/temporal.db, --ui-port, "8233", --ui-disable-news-fetch]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/data"]
    networks: [local]
    depends_on:
      temporal-volume-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, 127.0.0.1:7233]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    command: [api]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /forgeapi, health]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: [worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}

  demo:
    <<: *app
    profiles: [tools]
    entrypoint: [/demo]
    command: [-url, "http://api:8080"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}

  tests:
    profiles: [tools]
    build:
      context: .
      target: dev
    command: [go, test, -race, -count=1, -v, ./...]
    networks: [local]

volumes:
  postgres-data:
  temporal-data:

networks:
  local:
    # A normal project bridge permits host port publishing. Every published
    # port above is explicitly loopback-only; this is not an egress sandbox.
    driver: bridge
