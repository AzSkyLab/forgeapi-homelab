# Bound to an Entra app registration (or user-assigned managed identity) that has federated
# credentials for this service account, via the azure-workload-identity webhook. Replace the
# client-id annotation; the pod template's azure.workload.identity/use label is what makes the
# webhook act on pods using this service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeapi
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "<AZURE_CLIENT_ID_PLACEHOLDER>"
