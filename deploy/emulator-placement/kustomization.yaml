apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgeapi-placement
resources:
  - ../emulator
images:
  - name: forgeapi
    newTag: floci-placement
configMapGenerator:
  - name: forgeapi-emulator-targets
    files:
      - targets.example.yaml
patches:
  - path: runtime.yaml
