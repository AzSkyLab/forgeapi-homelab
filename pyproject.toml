[project]
name = "forgeapi"
version = "0.1.0"
description = "Minimal API that runs Terraform patterns as Temporal jobs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "temporalio>=1.33.0",
    "pyjwt[crypto]>=2.14.0",
    "python-hcl2>=8.1.4",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.25.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/archive-go"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
